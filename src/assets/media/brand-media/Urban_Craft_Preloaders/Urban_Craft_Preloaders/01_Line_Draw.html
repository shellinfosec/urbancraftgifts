<!doctype html>
<html lang="en" class="is-loading">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Urban Craft &amp; Co — Preloader 01: Line Draw</title>
    <style>
      /* ---------- PRELOADER CORE (keep) ---------- */
      html {
        --cream: #f8f6ee;
        --green: #2f3a2e;
        --brown: #8b5e3c;
        --sand: #e8ddc9;
        --gold: #d4b483;
        --char: #2b2828;
        --p: 0;
      }
      html.is-loading,
      html.is-loading body {
        overflow: hidden;
      }
      #preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #preloader,
      #preloader * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      #preloader.is-gone {
        display: none;
      }
      #preloader svg {
        overflow: visible;
      }
      .draw {
        stroke-dasharray: 1 2;
        stroke-dashoffset: 1;
        animation: draw 1.15s cubic-bezier(0.6, 0.05, 0.25, 1) var(--d, 0s) forwards;
      }
      @keyframes draw {
        to {
          stroke-dashoffset: 0;
        }
      }
      .line,
      .rline,
      .hole,
      .tagbody {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      @media (prefers-reduced-motion: reduce) {
        .draw {
          animation-duration: 0.01s !important;
          animation-delay: 0s !important;
        }
      }

      /* ---------- DEMO WEBSITE (delete on your real site) ---------- */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--cream);
        color: var(--char);
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .site {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .site nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 28px clamp(20px, 5vw, 64px);
      }
      .site nav svg {
        width: 150px;
        height: auto;
        fill: var(--char);
      }
      .site nav ul {
        display: flex;
        gap: 28px;
        list-style: none;
        font-size: 12px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }
      .hero {
        flex: 1;
        display: grid;
        place-content: center;
        text-align: center;
        padding: 40px 20px 90px;
        gap: 18px;
      }
      .hero h1 {
        font-family: Georgia, "Times New Roman", serif;
        font-weight: 400;
        font-size: clamp(34px, 6vw, 72px);
        letter-spacing: -0.01em;
      }
      .hero p {
        font-size: 12px;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: #6b645d;
      }
      .site nav,
      .hero > * {
        opacity: 0;
        transform: translateY(14px);
        transition:
          opacity 0.9s ease,
          transform 0.9s cubic-bezier(0.2, 0.7, 0.2, 1);
      }
      .site-ready nav,
      .site-ready .hero > * {
        opacity: 1;
        transform: none;
      }
      .site-ready .hero > *:nth-child(2) {
        transition-delay: 0.12s;
      }
      .site-ready .hero > *:nth-child(3) {
        transition-delay: 0.24s;
      }
      #replay {
        position: fixed;
        right: 18px;
        bottom: 18px;
        z-index: 10000;
        font:
          11px/1 "Helvetica Neue",
          Arial,
          sans-serif;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        background: var(--green);
        color: var(--cream);
        border: 1px solid rgba(248, 246, 238, 0.35);
        border-radius: 99px;
        padding: 11px 16px;
        cursor: pointer;
        opacity: 0.9;
      }
      #replay:hover {
        opacity: 1;
      }

      /* ---------- PRELOADER 01 · Line Draw (keep) ---------- */

      @keyframes show {
        to {
          opacity: 1;
        }
      }
      @keyframes fo {
        to {
          fill-opacity: 1;
        }
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      #preloader {
        background: var(--cream);
        display: grid;
        place-items: center;
        transition: transform 1s cubic-bezier(0.76, 0, 0.24, 1) 0.35s;
      }
      .wrap {
        display: grid;
        justify-items: center;
        gap: 38px;
        transition:
          opacity 0.5s ease,
          transform 0.7s ease;
      }
      .logo {
        width: clamp(250px, 32vw, 400px);
        height: auto;
        --bg: var(--cream);
        --tagfill: var(--cream);
        --tagtext: var(--green);
      }
      .logo .line,
      .logo .rline,
      .logo .hole,
      .logo .tagbody {
        stroke: var(--green);
        stroke-width: 5;
      }
      .logo .rfill {
        fill: var(--bg);
        opacity: 0;
        animation: show 0.6s ease 0.75s forwards;
      }
      .logo .tagbody {
        fill-opacity: 0;
        animation:
          draw 1.15s cubic-bezier(0.6, 0.05, 0.25, 1) var(--d) forwards,
          fo 0.5s ease 1.9s forwards;
      }
      .logo .tagtext {
        opacity: 0;
        animation: show 0.6s ease 2.1s forwards;
      }
      .logo .wm path {
        fill: var(--char);
        opacity: 0;
        animation: rise 1s cubic-bezier(0.2, 0.7, 0.2, 1) 2.1s forwards;
      }
      .logo .tg path {
        fill: var(--char);
        opacity: 0;
        animation: rise 1s cubic-bezier(0.2, 0.7, 0.2, 1) 2.6s forwards;
      }
      .bar {
        width: min(190px, 44vw);
        height: 1px;
        background: rgba(47, 58, 46, 0.16);
        overflow: hidden;
        opacity: 0;
        animation: show 0.8s ease 1s forwards;
      }
      .bar i {
        display: block;
        height: 100%;
        background: var(--brown);
        transform-origin: 0 50%;
        transform: scaleX(var(--p));
      }
      #preloader.is-leaving {
        transform: translateY(-100%);
      }
      #preloader.is-leaving .wrap {
        opacity: 0;
        transform: translateY(-16px);
      }
    </style>
    <noscript
      ><style>
        #preloader {
          display: none;
        }
        html.is-loading,
        html.is-loading body {
          overflow: auto;
        }
        .site nav,
        .hero > * {
          opacity: 1;
          transform: none;
        }
      </style></noscript
    >
  </head>

    <script>
      (function () {
        var root = document.documentElement,
          pre = document.getElementById("preloader");
        var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
        var MIN = reduce ? 900 : 3800; // minimum time the preloader is shown (ms)
        var EXIT = reduce ? 200 : 1350; // exit animation length (ms) — keep in sync with CSS
        var start = performance.now(),
          loaded = document.readyState === "complete",
          p = 0,
          ended = false;
        window.addEventListener("load", function () {
          loaded = true;
        });
        var pct = document.getElementById("pct"),
          rings = document.querySelectorAll("[data-prog]");
        function ease(t) {
          return t * t * (3 - 2 * t);
        } // smooth in/out so the counter feels even
        function tick(now) {
          var t = Math.min((now - start) / MIN, 1);
          var target = ease(t) * (loaded ? 1 : 0.92); // waits at 92% until the page has really loaded
          p += (target - p) * 0.14;
          if (target - p < 0.002 && loaded && t >= 1) p = 1;
          root.style.setProperty("--p", p.toFixed(4));
          for (var i = 0; i < rings.length; i++)
            rings[i].style.strokeDashoffset = (1 - p).toFixed(4);
          if (pct) pct.textContent = Math.round(p * 100);
          if (p >= 0.999 && !ended) {
            ended = true;
            leave();
            return;
          }
          requestAnimationFrame(tick);
        }
        function leave() {
          root.style.setProperty("--p", 1);
          if (pct) pct.textContent = "100";
          pre.classList.add("is-leaving");
          setTimeout(
            function () {
              document.body.classList.add("site-ready");
            },
            Math.round(EXIT * 0.45),
          ); // site content starts revealing as the exit plays
          setTimeout(function () {
            pre.classList.add("is-gone");
            root.classList.remove("is-loading");
          }, EXIT);
        }
        requestAnimationFrame(tick);
        var rp = document.getElementById("replay");
        if (rp)
          rp.addEventListener("click", function () {
            location.reload();
          });
      })();
